[project]
name = "kws-backend"
version = "0.1.0"
description = "CPU-only keyword spotting backend"
requires-python = ">=3.13,<3.14"
dependencies = [
    "fastapi>=0.115,<1",
    "python-multipart>=0.0.20,<1",
    "uvicorn>=0.34,<1",
    "numpy>=2,<3",
    "onnxruntime>=1.22,<2",
    "psutil>=7,<8",
    "scipy>=1.15,<2",
    "websockets>=15,<17",
    "pycaw>=20260927 ; sys_platform == 'win32'",
    "comtypes>=1.4.17 ; sys_platform == 'win32'",
    "winrt-windows-media-control>=3.2.1 ; sys_platform == 'win32'",
    "winrt-windows-foundation>=3.2.1 ; sys_platform == 'win32'",
    "winrt-windows-foundation-collections>=3.2.1 ; sys_platform == 'win32'",
]

# Training, evaluation and ONNX export need torch. The deployed API only needs
# onnxruntime, so torch stays in an extra that `uv sync` never installs unasked.
[project.optional-dependencies]
train = [
    "torch>=2.6,<3",
    "onnx>=1.18,<2",
    "onnxscript>=0.3,<1",
]

[dependency-groups]
dev = [
    "httpx>=0.28,<1",
    "pytest>=8,<10",
    "ruff>=0.11,<1",
    "mypy>=1.15,<2",
    "types-psutil>=7,<8",
    "scipy-stubs>=1.18.1.1",
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cpu" }

[tool.vercel]
entrypoint = "app.main:app"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.13"
strict = true
files = ["app", "ml", "../scripts"]

[[tool.mypy.overrides]]
module = ["onnxruntime", "onnxruntime.*", "onnx", "onnx.*"]
ignore_missing_imports = true
